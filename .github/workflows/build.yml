name: Build standalone executable

# Builds Squeeze as a standalone, no-Python-required executable on real
# Windows/macOS/Linux runners (PyInstaller doesn't cross-compile, so this
# is the only way to get all three from one CI run). Pushing a `v*` tag
# also creates a GitHub Release and attaches every executable to it; a
# manual run just uploads them as workflow artifacts so a build can be
# checked before deciding to cut a release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system Tk + Xvfb (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pyinstaller

      - name: Build Squeeze
        run: pyinstaller packaging/squeeze.spec

      # Prove the build actually launches, not just that PyInstaller
      # didn't error — a build with a missing hidden import can still
      # "succeed" and produce an executable that crashes immediately.
      - name: Verify build launches (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 scripts/_pyinstaller_exe_smoke.py dist/Squeeze

      - name: Verify build launches (Windows)
        if: runner.os == 'Windows'
        run: python scripts/_pyinstaller_exe_smoke.py dist/Squeeze.exe

      - name: Verify build launches (macOS)
        if: runner.os == 'macOS'
        run: python3 scripts/_pyinstaller_exe_smoke.py dist/Squeeze.app/Contents/MacOS/Squeeze

      # Upload the raw build output directly rather than pre-zipping it
      # ourselves — actions/upload-artifact always wraps whatever it's
      # given in one zip for download regardless, so pre-zipping here
      # would leave whoever downloads it with a zip inside a zip. This way
      # it's download -> extract once -> the app is right there.
      - name: Select build output path
        id: artifact_path
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) echo "path=dist/Squeeze" >> "$GITHUB_OUTPUT" ;;
            Windows) echo "path=dist/Squeeze.exe" >> "$GITHUB_OUTPUT" ;;
            macOS) echo "path=dist/Squeeze.app" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: Squeeze-${{ runner.os }}
          path: ${{ steps.artifact_path.outputs.path }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Release assets must be individual files — the macOS build is
      # uploaded as a raw .app *directory* (nicer for a plain artifact
      # download: extract once, the app is right there), so zip it here
      # for the one path that actually requires a single file.
      - name: Zip any directory artifacts (e.g. Squeeze.app) for release upload
        run: |
          cd artifacts
          for d in */; do
            d="${d%/}"
            if [ -d "$d" ]; then
              zip -r -y "${d}.zip" "$d"
              rm -rf "$d"
            fi
          done

      - name: Create release and attach executable
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
